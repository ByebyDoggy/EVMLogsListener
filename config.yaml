chains:
  - name: ethereum
    chain_id: 1
    poll_interval: 30
    # --- Option A: legacy RPC node pool (per-node priority, rate limit) ---
    # rpc_nodes:
    #   - url: "https://ethereum-rpc.publicnode.com"
    #     priority: 1
    #     type: public
    #     rate_limit:
    #       requests_per_second: 5
    #       burst: 10
    #   - url: "https://1rpc.io/eth"
    #     priority: 2
    #     type: public
    #     rate_limit:
    #       requests_per_second: 5
    #       burst: 10
    #   - url: "https://cloudflare-eth.com"
    #     priority: 3
    #     type: public
    #     rate_limit:
    #       requests_per_second: 2
    #       burst: 5
    #   - url: "https://eth.drpc.org"
    #     priority: 4
    #     type: public
    #     rate_limit:
    #       requests_per_second: 5
    #       burst: 10
    #   - url: "https://rpc.ankr.com/eth"
    #     priority: 5
    #     type: public
    #     rate_limit:
    #       requests_per_second: 5
    #       burst: 10
    # --- Option B: apipool-server auto-load (v1.0.5+) ---
    # Replace hardcoded URLs with server-managed key list.
    apipool_server:                        # Uncomment to use instead of rpc_nodes
      service_url: "http://localhost:8000"  # apipool-server address
      pool_identifier: "ethereum-rpc"       # Pool identifier on server (keys are resolved via pool membership)
      username: "user1"                     # Login username
      password: "12345678"       # Login password (env var supported)

cache:
  max_size: 10000

api:
  host: "0.0.0.0"
  port: 8080

log:
  level: INFO
  format: json
  output: stdout

health:
  enabled: true
  endpoint: /health

alert_processor:
  enabled: true
  url: "http://localhost:8001"
  push_interval_seconds: 5
  batch_size: 200
  max_payload_mb: 10
  retry_attempts: 3
  retry_base_delay_sec: 1
  timeout_seconds: 10
  reconnect_check_on_startup: true
  replay_endpoint: "/ingest/logs/replay"

# --- Log Recorder: save logs to local SQLite storage ---
# Enable in realtime or backtest mode to record all incoming logs.
# Recorded data can later be replayed via the `replay` config.
recorder:
  enabled: true                       # Set true to enable recording
  directory: "./recordings"           # Directory for the SQLite database
  # db_filename: "logs.db"            # SQLite filename (default: logs.db)

# --- Log Replay: load logs from local SQLite storage instead of RPC ---
# Only used in backtest mode. When configured, backtest will read logs
# from a local database instead of querying RPC nodes.
# replay:
#   file_path: "./recordings/logs.db"   # SQLite database path
#   # OR directory mode (auto-discovers .db files):
#   # directory: "./recordings"
#   from_block: null                    # Optional block range filter
#   to_block: null
#   blocks_per_batch: 2                 # Number of blocks per replay batch (default: 2)
#   batch_interval_seconds: 5.0         # Seconds to wait between batches (default: 5.0)

# --- Backtest Startup Config ---
# Only used in backtest mode. When from_block/to_block are set, a backtest
# task is automatically submitted on startup for each configured chain.
# Can also be set via CLI: --from-block and --to-block (CLI overrides config).
# backtest:
#   from_block: 19000000              # Starting block (inclusive)
#   to_block: 19002000                # Ending block (inclusive)
#   batch_size: 1000                  # Blocks per batch query
