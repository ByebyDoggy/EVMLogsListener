[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "evm-chain-listener"
version = "1.0.0"
description = "Lightweight EVM-compatible chain log listener"
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.9.0",
    "apipool-ng>=1.0.7",
    "pyyaml>=6.0",
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "jinja2>=3.1.0",
    "websockets>=12.0",
]

[tool.setuptools.packages.find]
where = ["."]
