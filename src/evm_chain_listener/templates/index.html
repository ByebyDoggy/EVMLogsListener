<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EVM Chain Listener</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid #334155;
        }
        h1 {
            font-size: 1.5rem;
            color: #f8fafc;
        }
        .status-badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.875rem;
            font-weight: 500;
        }
        .status-healthy {
            background: #166534;
            color: #bbf7d0;
        }
        .status-degraded {
            background: #854d0e;
            color: #fef08a;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .card {
            background: #1e293b;
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #334155;
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .card-title {
            font-size: 1rem;
            font-weight: 600;
            color: #94a3b8;
        }
        .card-value {
            font-size: 2rem;
            font-weight: 700;
            color: #f8fafc;
        }
        .chain-list {
            list-style: none;
        }
        .chain-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #334155;
        }
        .chain-item:last-child {
            border-bottom: none;
        }
        .chain-name {
            font-weight: 500;
        }
        .chain-status {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.875rem;
            color: #94a3b8;
        }
        .chain-status .running {
            color: #4ade80;
        }
        .filters {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 20px;
        }
        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .filter-group label {
            font-size: 0.75rem;
            color: #94a3b8;
            text-transform: uppercase;
        }
        .filter-group input, .filter-group select {
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #e2e8f0;
            font-size: 0.875rem;
            min-width: 150px;
        }
        .btn {
            padding: 8px 16px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-size: 0.875rem;
            font-weight: 500;
            transition: background 0.2s;
        }
        .btn-primary {
            background: #3b82f6;
            color: white;
        }
        .btn-primary:hover {
            background: #2563eb;
        }
        .logs-table {
            width: 100%;
            border-collapse: collapse;
        }
        .logs-table th {
            text-align: left;
            padding: 12px;
            background: #0f172a;
            color: #94a3b8;
            font-size: 0.75rem;
            text-transform: uppercase;
            position: sticky;
            top: 0;
        }
        .logs-table td {
            padding: 12px;
            border-bottom: 1px solid #334155;
            font-size: 0.875rem;
        }
        .logs-table td:first-child {
            font-family: monospace;
            color: #60a5fa;
        }
        .hash {
            font-family: monospace;
            color: #a78bfa;
        }
        .address {
            font-family: monospace;
            color: #34d399;
        }
        .topic {
            font-family: monospace;
            font-size: 0.75rem;
            color: #fbbf24;
            max-width: 200px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-top: 20px;
        }
        .pagination-info {
            color: #94a3b8;
            font-size: 0.875rem;
        }
        .auto-refresh {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .auto-refresh input {
            width: 18px;
            height: 18px;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #94a3b8;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid #334155;
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>EVM Chain Listener</h1>
            <div>
                <span id="status-badge" class="status-badge status-healthy">Loading...</span>
            </div>
        </header>

        <div class="grid">
            <div class="card">
                <div class="card-header">
                    <span class="card-title">Total Logs</span>
                </div>
                <div class="card-value" id="total-logs">-</div>
            </div>
            <div class="card">
                <div class="card-header">
                    <span class="card-title">Cache Size</span>
                </div>
                <div class="card-value" id="cache-size">-</div>
            </div>
            <div class="card">
                <div class="card-header">
                    <span class="card-title">Active Chains</span>
                </div>
                <div class="card-value" id="active-chains">-</div>
            </div>
        </div>

        <div class="card" style="margin-bottom: 20px;">
            <div class="card-header">
                <span class="card-title">Chain Status</span>
            </div>
            <ul class="chain-list" id="chain-list">
                <li class="loading"><span class="spinner"></span> Loading...</li>
            </ul>
        </div>

        <div class="card">
            <div class="card-header">
                <span class="card-title">Recent Logs</span>
                <div class="auto-refresh">
                    <input type="checkbox" id="auto-refresh" checked>
                    <label for="auto-refresh">Auto refresh</label>
                </div>
            </div>
            
            <div class="filters">
                <div class="filter-group">
                    <label>Chain</label>
                    <select id="filter-chain">
                        <option value="">All Chains</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>Address</label>
                    <input type="text" id="filter-address" placeholder="0x...">
                </div>
                <div class="filter-group">
                    <label>From Block</label>
                    <input type="number" id="filter-from-block" placeholder="Min block">
                </div>
                <div class="filter-group">
                    <label>To Block</label>
                    <input type="number" id="filter-to-block" placeholder="Max block">
                </div>
                <div class="filter-group" style="justify-content: flex-end;">
                    <label>&nbsp;</label>
                    <button class="btn btn-primary" onclick="fetchLogs()">Search</button>
                </div>
            </div>

            <div style="overflow-x: auto;">
                <table class="logs-table">
                    <thead>
                        <tr>
                            <th>Block</th>
                            <th>Chain</th>
                            <th>Address</th>
                            <th>Topic0</th>
                            <th>Tx Hash</th>
                        </tr>
                    </thead>
                    <tbody id="logs-body">
                        <tr><td colspan="5" class="loading"><span class="spinner"></span> Loading...</td></tr>
                    </tbody>
                </table>
            </div>

            <div class="pagination">
                <button class="btn btn-primary" onclick="prevPage()" id="btn-prev">Prev</button>
                <span class="pagination-info" id="pagination-info">Page 1 of 1</span>
                <button class="btn btn-primary" onclick="nextPage()" id="btn-next">Next</button>
            </div>
        </div>
    </div>

    <script>
        let currentPage = 1;
        let totalPages = 1;
        let refreshInterval = null;

        async function fetchStats() {
            try {
                const res = await fetch('/api/logs/stats');
                const data = await res.json();
                if (data.status === 'success') {
                    document.getElementById('total-logs').textContent = data.data.total_logs.toLocaleString();
                    document.getElementById('cache-size').textContent = data.data.max_size.toLocaleString();
                }
            } catch (e) {
                console.error('Failed to fetch stats:', e);
            }
        }

        async function fetchChains() {
            try {
                const res = await fetch('/api/chains');
                const data = await res.json();
                if (data.status === 'success') {
                    const list = document.getElementById('chain-list');
                    const select = document.getElementById('filter-chain');
                    
                    list.innerHTML = data.data.chains.map(chain => `
                        <li class="chain-item">
                            <span class="chain-name">${chain.name} (ID: ${chain.chain_id})</span>
                            <span class="chain-status">
                                <span class="${chain.status}">${chain.status}</span>
                                <span>Block: ${chain.last_block || '-'}</span>
                            </span>
                        </li>
                    `).join('');
                    
                    document.getElementById('active-chains').textContent = data.data.chains.length;
                    
                    // Update filter dropdown
                    select.innerHTML = '<option value="">All Chains</option>' + 
                        data.data.chains.map(c => `<option value="${c.chain_id}">${c.name}</option>`).join('');
                }
            } catch (e) {
                console.error('Failed to fetch chains:', e);
            }
        }

        async function fetchHealth() {
            try {
                const res = await fetch('/health');
                const data = await res.json();
                const badge = document.getElementById('status-badge');
                badge.textContent = data.status;
                badge.className = 'status-badge status-' + data.status;
            } catch (e) {
                console.error('Failed to fetch health:', e);
            }
        }

        async function fetchLogs() {
            const chainId = document.getElementById('filter-chain').value;
            const address = document.getElementById('filter-address').value;
            const fromBlock = document.getElementById('filter-from-block').value;
            const toBlock = document.getElementById('filter-to-block').value;

            const params = new URLSearchParams();
            if (chainId) params.append('chain_id', chainId);
            if (address) params.append('address', address);
            if (fromBlock) params.append('from_block', fromBlock);
            if (toBlock) params.append('to_block', toBlock);
            params.append('page', currentPage);
            params.append('page_size', 20);

            try {
                const res = await fetch('/api/logs?' + params.toString());
                const data = await res.json();
                if (data.status === 'success') {
                    const tbody = document.getElementById('logs-body');
                    const logs = data.data.logs;
                    
                    if (logs.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; color: #94a3b8;">No logs found</td></tr>';
                    } else {
                        tbody.innerHTML = logs.map(log => `
                            <tr>
                                <td>${parseInt(log.block_number, 16).toLocaleString()}</td>
                                <td>${log.chain_name || log.chain_id || '-'}</td>
                                <td class="address" title="${log.address}">${log.address.slice(0, 10)}...${log.address.slice(-8)}</td>
                                <td class="topic" title="${log.topics[0] || '-'}">${log.topics[0] || '-'}</td>
                                <td class="hash" title="${log.transaction_hash}">${log.transaction_hash.slice(0, 10)}...${log.transaction_hash.slice(-8)}</td>
                            </tr>
                        `).join('');
                    }

                    totalPages = data.data.pagination.total_pages;
                    document.getElementById('pagination-info').textContent = 
                        `Page ${currentPage} of ${totalPages} (${data.data.pagination.total} total)`;
                    
                    document.getElementById('btn-prev').disabled = currentPage <= 1;
                    document.getElementById('btn-next').disabled = currentPage >= totalPages;
                }
            } catch (e) {
                console.error('Failed to fetch logs:', e);
            }
        }

        function prevPage() {
            if (currentPage > 1) {
                currentPage--;
                fetchLogs();
            }
        }

        function nextPage() {
            if (currentPage < totalPages) {
                currentPage++;
                fetchLogs();
            }
        }

        function startAutoRefresh() {
            if (refreshInterval) clearInterval(refreshInterval);
            refreshInterval = setInterval(() => {
                if (document.getElementById('auto-refresh').checked) {
                    fetchStats();
                    fetchChains();
                    fetchHealth();
                    if (currentPage === 1) fetchLogs();
                }
            }, 5000);
        }

        // Initial load
        fetchStats();
        fetchChains();
        fetchHealth();
        fetchLogs();
        startAutoRefresh();
    </script>
</body>
</html>
